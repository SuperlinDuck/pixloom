name: Deploy Pixloom

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pixloom-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/pixloom_actions
          chmod 600 ~/.ssh/pixloom_actions
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/pixloom_actions \
            "$VPS_USER@$VPS_HOST" \
            'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /var/www/pixloom

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          pnpm install --frozen-lockfile
          pnpm run build

          pm2 reload ecosystem.config.js --update-env
          pm2 save

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://127.0.0.1:3000/ >/dev/null

          echo "Pixloom deployment completed."
          REMOTE